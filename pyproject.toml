[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-faceswap-workflow"
version = "0.1.0"
description = "A consent-first FaceFusion workflow that restores natural eye and mouth performance."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "welttowelt" }]
dependencies = [
  "mediapipe==0.10.21",
  "numpy>=1.26,<2",
  "opencv-contrib-python==4.11.0.86",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
natural-faceswap = "natural_faceswap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
